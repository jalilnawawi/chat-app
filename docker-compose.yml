services:
  postgres:
    image: postgres:18-alpine
    container_name: chatapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chatapp
    ports:
      # 5433 di host biar nggak bentrok sama Postgres lokal di 5432
      - "5433:5432"
    volumes:
      # Postgres 18 menaruh data di subdirektori versi. Mount di
      # /var/lib/postgresql (bukan .../data) sesuai konvensi baru image-nya.
      - chatapp-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chatapp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: chatapp-redis
    restart: unless-stopped
    # Redis di sini cuma jalur siaran dan penghitung kuota — semua isinya bisa
    # dibangun ulang dari koneksi yang aktif. Persistensi dimatikan supaya tidak
    # ada fsync di jalur yang menentukan cepat-lambatnya pesan sampai.
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Penyimpanan lampiran (Fase 7).
  #
  # Satu container menjalankan master + volume + filer sekaligus lewat
  # `weed server`. Di produksi ketiganya dipisah; di sini tidak, karena yang
  # ingin dibuktikan adalah jalur datanya — bukan topologi klasternya.
  #
  # -ip=127.0.0.1 membuat master mencatat alamat volume server sebagai
  # localhost. Terdengar salah, tapi justru benar untuk container all-in-one:
  # yang membaca catatan itu adalah filer di dalam container yang SAMA, jadi
  # "localhost" memang menunjuk tujuan yang tepat — dan tidak ada
  # ketergantungan pada DNS antar container.
  seaweedfs:
    image: chrislusf/seaweedfs:4.40
    container_name: chatapp-seaweedfs
    restart: unless-stopped
    command: >
      server
      -dir=/data
      -ip=127.0.0.1
      -ip.bind=0.0.0.0
      -filer
      -master.volumeSizeLimitMB=512
      -volume.max=16
    ports:
      # Hanya filer yang perlu dijangkau aplikasi. Port master (9333) dibuka
      # untuk melihat dasbornya saat mengembangkan, bukan karena dipakai.
      - "8890:8888"
      - "9334:9333"
    volumes:
      - chatapp-seaweed:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8888/?limit=1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Penampung surat untuk pengembangan (Fase 10).
  #
  # Mailpit menerima SMTP di 1025 dan menampilkan apa pun yang masuk di 8025.
  # Dia sengaja TIDAK meneruskan surat ke mana-mana: yang ingin dibuktikan
  # secara lokal adalah bahwa tautan verifikasi dan pemulihan benar-benar
  # tersusun dan terkirim, bukan bahwa alamat orang sungguhan bisa dijangkau.
  #
  # Tanpa SMTP_URL, seluruh fitur email mati dan aplikasinya tetap utuh — pola
  # satu-variabel yang sama dengan REDIS_URL dan SEAWEED_FILER_URL. Container
  # ini adalah cara mencoba jalur yang menyala, bukan syarat menjalankannya.
  mailpit:
    image: axllent/mailpit:v1.28
    container_name: chatapp-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  chatapp-pgdata:
  chatapp-seaweed:
